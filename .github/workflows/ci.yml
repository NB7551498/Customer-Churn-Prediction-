name: CI/CD — Quality Gate, Pytest, Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint, Test & Model Quality Gate
  # ──────────────────────────────────────────────
  test:
    name: Lint, Test & Model Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff linting
        run: ruff check .

      - name: Run Pytest suite
        run: pytest -v --tb=short

      - name: Model Quality Gate (Assert ROC-AUC >= 0.80, PR-AUC >= 0.60)
        run: |
          python -c "
          import json
          with open('reports/evaluation_metrics.json') as f:
              data = json.load(f)
          roc_auc = data['metrics_at_default_threshold_0_50']['roc_auc']
          pr_auc = data['metrics_at_default_threshold_0_50']['pr_auc']
          brier = data['metrics_at_default_threshold_0_50']['brier_score']
          print(f'Model Quality Gate: ROC-AUC={roc_auc}, PR-AUC={pr_auc}, Brier={brier}')
          assert roc_auc >= 0.80, f'ROC-AUC {roc_auc} below threshold 0.80'
          assert pr_auc >= 0.60, f'PR-AUC {pr_auc} below threshold 0.60'
          assert brier <= 0.20, f'Brier score {brier} exceeds threshold 0.20'
          print('>>> Model Quality Gate PASSED successfully! <<<')
          "

  # ──────────────────────────────────────────────
  # Job 2: Docker Build & Service Smoke Test
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build & Health Smoke Test
    runs-on: ubuntu-latest
    needs: test          # only run if lint, tests, and quality gate pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t churn-api:ci .

      - name: Start container
        run: |
          docker run -d --name churn-ci-container -p 8000:8000 churn-api:ci
          # Wait for the service to be ready (up to 30s)
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "API is up"
              break
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done

      - name: Smoke test /health
        run: |
          STATUS=$(curl -sf http://localhost:8000/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          echo "API status: $STATUS"
          [ "$STATUS" = "healthy" ] || [ "$STATUS" = "degraded" ]

      - name: Smoke test /model/info
        run: curl -sf http://localhost:8000/model/info | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'version' in d"

      - name: Smoke test /monitoring/report
        run: curl -sf http://localhost:8000/monitoring/report | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'overall_status' in d"

      - name: Stop container
        if: always()
        run: docker stop churn-ci-container && docker rm churn-ci-container
